<mat-card class="form-card">
	<mat-card-header>
		<mat-card-title>Novo funcionário</mat-card-title>
		<mat-card-subtitle>Cadastre quem pode retirar ferramentas</mat-card-subtitle>
	</mat-card-header>
	<mat-card-content>
		<form [formGroup]="formulario" (ngSubmit)="salvar()">
			<mat-form-field appearance="outline">
				<mat-label>Nome completo</mat-label>
				<input matInput formControlName="nomeFuncionario" placeholder="Ex.: Ana Souza">
				@if (formulario.controls.nomeFuncionario.hasError('required')) { <mat-error>Informe o nome.</mat-error> }
			</mat-form-field>
			<mat-form-field appearance="outline">
				<mat-label>Cargo</mat-label>
				<input matInput formControlName="cargo" placeholder="Ex.: Técnica de manutenção">
				@if (formulario.controls.cargo.hasError('required')) { <mat-error>Informe o cargo.</mat-error> }
			</mat-form-field>
			<button mat-flat-button color="primary" type="submit" [disabled]="salvando">Cadastrar funcionário</button>
		</form>
	</mat-card-content>
</mat-card>
