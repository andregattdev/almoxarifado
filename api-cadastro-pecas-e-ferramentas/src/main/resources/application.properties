spring.application.name=api-cadastro-pecas-e-ferramentas

# Porta do servidor
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api-cadastro-pecas-e-ferramentas}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Spring Boot 4 / Jackson 3: a chave correta fica em spring.jackson.json.*
spring.jackson.json.deserialization.fail-on-null-for-primitives=false
spring.jackson.json.deserialization.fail-on-unknown-properties=false
